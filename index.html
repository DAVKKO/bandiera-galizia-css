<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Bandiera della Galizia - Esercizio CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="flag">
    <div class="stripe"></div>

    <div class="shield-box">
      
      <div class="crown">
        <div class="spike"></div>
        <div class="spike"></div>
        <div class="spike"></div>
        <div class="spike"></div>
        <div class="spike"></div>
        <div class="crown-base"></div>
      </div>

      <div class="shield">
        <div class="host"></div>
        <div class="cup"></div>
        <div class="stem"></div>
        <div class="knot"></div>
        <div class="foot"></div>

        <div class="cross c1"><div class="v"></div><div class="h"></div></div>
        <div class="cross c2"><div class="v"></div><div class="h"></div></div>
        <div class="cross c3"><div class="v"></div><div class="h"></div></div>
        <div class="cross c4"><div class="v"></div><div class="h"></div></div>
        <div class="cross c5"><div class="v"></div><div class="h"></div></div>
        <div class="cross c6"><div class="v"></div><div class="h"></div></div>
        <div class="cross c7"><div class="v"></div><div class="h"></div></div>
      </div>

    </div>
  </div>

  <p class="caption">Bandiera della Galizia (Spagna) - Realizzata con HTML e CSS</p>

</body>
</html>
